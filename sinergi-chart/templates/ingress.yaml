apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sinergi
  namespace: accounting
spec:
  ingressClassName: nginx
  rules:
    - host: accounting.mhuda.my.id
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: laravel
                port:
                  number: 10000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
