apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel
  namespace: accounting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
    spec:
      containers:
        - name: laravel
          image: "{{ .Values.laravel.image.repository }}:{{ .Values.laravel.image.tag }}"
          imagePullPolicy: {{ .Values.laravel.image.pullPolicy }}
          ports:
            - containerPort: 9000

          envFrom:
            - configMapRef:
                name: laravel-config
            - secretRef:
                name: laravel-secret
